<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<title>Verso — Recherche dans le livre</title>

<style id="fonts">@font-face{font-family:'Atkinson Hyperlegible Next';font-style:normal;font-weight:200 800;font-display:block;src:url(../fonts/atkinson-next-normal.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible Next';font-style:italic;font-weight:200 800;font-display:block;src:url(../fonts/atkinson-next-italic.woff2) format('woff2')}
@font-face{font-family:'Literata';font-style:normal;font-weight:200 900;font-display:block;src:url(../fonts/literata-normal.woff2) format('woff2')}
@font-face{font-family:'Literata';font-style:italic;font-weight:200 900;font-display:block;src:url(../fonts/literata-italic.woff2) format('woff2')}</style>


<style>
body{margin:0;font-family:'Literata', Georgia, serif;color:#1F1B16;background:#F5F1E8}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;text-align:left;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:#7A3021}a:hover{color:#1F1B16}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F5F1E8; color: #1F1B16; font-family: 'Literata', Georgia, serif;">
<div style="display: flex; align-items: center; gap: 4px; height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; background: #ECE5D9;">
<button aria-label="Fermer la recherche" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; color: #1F1B16;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
<input type="search" aria-label="Rechercher dans le livre" value="rivière" style="flex: 1 1 0%; min-width: 0px; height: 48px; border: 0px; background: transparent; font-size: 18px; outline: none;">
<button aria-label="Effacer la recherche" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; border-radius: 24px; color: #1F1B16;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<div role="progressbar" aria-label="Recherche en cours" style="height: 3px; background: #DDD4C5; flex-shrink: 0;"><span style="display: block; width: 45%; height: 100%; background: #7A3021;"></span></div>
<p role="status" style="margin: 0; padding: 14px 24px 4px; font-size: 14px; color: #4A433B;">Recherche dans tout le livre… 3 résultats pour l’instant</p>
<h2 style="margin: 0; padding: 14px 24px 4px; font-size: 14px; font-weight: 700; color: #4A433B;">Deuxième partie, chapitre I</h2>
<ul style="list-style: none; margin: 0; padding: 0;"><li><button style="display: flex; flex-direction: column; gap: 6px; width: 100%; box-sizing: border-box; padding: 14px 24px; border-bottom: 1px solid #D3CABB;">
<span style="font-size: 16px; line-height: 1.55;">…au fond d’une vallée qu’arrose la Rieule, petite <mark style="background: #F3D9A4; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px;">rivière</mark> qui se jette dans l’Andelle, après avoir fait tourner trois moulins…</span>
<span style="font-size: 14px; color: #4A433B;">30 %</span>
</button></li><li><button style="display: flex; flex-direction: column; gap: 6px; width: 100%; box-sizing: border-box; padding: 14px 24px; border-bottom: 1px solid #D3CABB;">
<span style="font-size: 16px; line-height: 1.55;">…d’où l’on découvre la vallée. La <mark style="background: #F3D9A4; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px;">rivière</mark> qui la traverse en fait comme deux régions de physionomie distincte…</span>
<span style="font-size: 14px; color: #4A433B;">30 %</span>
</button></li><li><button style="display: flex; flex-direction: column; gap: 6px; width: 100%; box-sizing: border-box; padding: 14px 24px; border-bottom: 1px solid #D3CABB;">
<span style="font-size: 16px; line-height: 1.55;">…le bourg paresseux, s’écartant de la plaine, a continué naturellement à s’agrandir vers la <mark style="background: #F3D9A4; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px;">rivière</mark>.</span>
<span style="font-size: 14px; color: #4A433B;">31 %</span>
</button></li></ul>
</div>




</body></html>
